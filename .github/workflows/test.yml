name: test
on:
  push:
  pull_request:
jobs:
  test:
    # Pinned image: `ubuntu-latest` moved to 26.04, where actions/setup-python
    # has no prebuilt 3.12 wheels yet and Playwright's apt deps differ.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: storyaudit
          POSTGRES_PASSWORD: storyaudit
          POSTGRES_DB: storyaudit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U storyaudit"
          --health-interval=2s --health-timeout=2s --health-retries=20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://storyaudit:storyaudit@localhost:5432/storyaudit_test
      TEST_DATABASE_URL: postgresql+psycopg://storyaudit:storyaudit@localhost:5432/storyaudit_test
      APP_ACCESS_TOKEN: test-token
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # Floating minor version: patch releases for 3.12 keep appearing,
          # and pinning an exact patch breaks whenever the image is refreshed.
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python scripts/wait_for_db.py
      - run: playwright install --with-deps chromium
      - run: ruff check .
      - run: alembic upgrade head
      - run: python -m pytest -q
