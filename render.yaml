services:
  - type: web
    name: storyaudit-api
    runtime: python
    region: oregon
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && playwright install chromium
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: storyaudit-postgres
          property: connectionString
      - key: APP_ACCESS_TOKEN
        sync: false
      - key: MAX_REQUEST_BODY_BYTES
        value: "2097152"
      - key: WEBSITE_MAX_PAGES
        value: "5"
      - key: WEBSITE_FETCH_TIMEOUT_SECONDS
        value: "15"
      - key: WEBSITE_ALLOW_PRIVATE_HOSTS
        value: "false"

  - type: worker
    name: storyaudit-worker
    runtime: python
    region: oregon
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m app.worker
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: storyaudit-postgres
          property: connectionString
      - key: JOB_POLL_INTERVAL_SECONDS
        value: "2"
      - key: JOB_LEASE_SECONDS
        value: "300"
      - key: JOB_HEARTBEAT_SECONDS
        value: "30"
      - key: JOB_MAX_ATTEMPTS
        value: "3"
      - key: LLM_PROVIDER
        value: openai_compatible
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_API_KEY
        sync: false

databases:
  - name: storyaudit-postgres
    region: oregon
    plan: basic-256mb
